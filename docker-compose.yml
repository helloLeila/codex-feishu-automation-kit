services:
  editor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: "${NODE_BASE_IMAGE:-node:20-bookworm-slim}"
    ports:
      - "${PORT:-3210}:3210"
    environment:
      PORT: "3210"
      HOST: "0.0.0.0"
      OPEN_WECHAT_EDITOR_CONFIG_DIR: "/data/config"
      WECHAT_APP_ID: "${WECHAT_APP_ID:-}"
      WECHAT_APP_SECRET: "${WECHAT_APP_SECRET:-}"
      WECHAT_API_BASE_URL: "${WECHAT_API_BASE_URL:-https://api.weixin.qq.com}"
      WECHAT_DEFAULT_AUTHOR: "${WECHAT_DEFAULT_AUTHOR:-}"
      WECHAT_AUTO_SYNC: "${WECHAT_AUTO_SYNC:-false}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      GLM_IMAGE_API_KEY: "${GLM_IMAGE_API_KEY:-}"
      GLM_IMAGE_BASE_URL: "${GLM_IMAGE_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}"
      GLM_IMAGE_MODEL: "${GLM_IMAGE_MODEL:-cogview-3-flash}"
      GLM_IMAGE_SIZE: "${GLM_IMAGE_SIZE:-900x383}"
      MAIL_ENABLED: "${MAIL_ENABLED:-false}"
      MAIL_ALERT_TO: "${MAIL_ALERT_TO:-}"
      MAIL_VERIFICATION_FROM: "${MAIL_VERIFICATION_FROM:-}"
      MAIL_DEV_RETURN_CODE: "${MAIL_DEV_RETURN_CODE:-false}"
      MAIL_SEND_URL: "${MAIL_SEND_URL:-}"
      MAIL_SEND_TOKEN: "${MAIL_SEND_TOKEN:-}"
      EDITOR_AUTH_ENABLED: "${EDITOR_AUTH_ENABLED:-false}"
      EDITOR_AUTH_USER: "${EDITOR_AUTH_USER:-editor}"
      EDITOR_AUTH_PASSWORD: "${EDITOR_AUTH_PASSWORD:-}"
      EDITOR_SESSION_SECRET: "${EDITOR_SESSION_SECRET:-}"
      EDITOR_REGISTRATION_ENABLED: "${EDITOR_REGISTRATION_ENABLED:-false}"
    volumes:
      - "./data:/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck-wechat-editor.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
